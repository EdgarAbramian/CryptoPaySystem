version: "3.9"

services:
  api:
    build: .
    command: uvicorn services.api.app:app --host 0.0.0.0 --port 8000 --reload
    network_mode: host
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  watcher:
    build: .
    command: python -m services.watcher.zmq_watcher
    network_mode: host
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  ledger:
    build: .
    command: python -m services.ledger
    network_mode: host
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped